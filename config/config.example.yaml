STEPS: []

# ---- Chrome 连接参数 ----
WS_ENDPOINT: ""

# Chrome 用户数据目录 (独立 profile, 与日常 Chrome 不冲突)
USER_DATA_DIR: "~/chrome-debug-profile"

# Chrome 通道: stable / beta / canary / dev
CHANNEL: "stable"

# ---- [可选] 输出文件目录 ----
OUTPUT_DIR: "~/chrome-devtools-downloads"

# ---- [可选] 日志文件路径 ----
LOG_FILE: "~/chrome-devtools-downloads/auto_download.log"

# ---- [可选] 重试次数 ----
MAX_RETRIES: 3

# ---- [可选] 步骤间等待时间 (秒) ----
STEP_DELAY: 2

# ---- [可选] 步骤数量安全限制 ----
MAX_STEPS: 100
MAX_EXECUTIONS: 500

# ---- [可选] 定时执行时间 (24h 格式) ----
SCHEDULE_TIME: "09:00"