# chrome-auto-fetch 配置文件
# =========================
# 复制此文件为 config.yaml, 然后根据需求填写

# ---- [必填] chrome-devtools 二进制路径 ----
# macOS Homebrew: /usr/local/bin/chrome-devtools
# Linux: /usr/local/bin/chrome-devtools
# Windows: chrome-devtools.exe (需加入 PATH)
# Cargo 编译: target/release/chrome-devtools
CLI_PATH: ""

# ---- [必填] 目标网站 URL ----
# Discovery 模式需要此 URL 导航到目标页面
TARGET_URL: ""

# ---- [必填] 自定义步骤流程 (STEPS) ----
# STEPS 是核心配置, 定义自动化流程的步骤序列
# 每个步骤包含 action (动作类型) 和对应参数
# 不配 STEPS 时程序报错终止 — 必须填写
#
# 支持的 action 类型:
#   navigate  — 导航到 URL                    参数: url
#   fill      — 填入输入框/下拉框              参数: params={selector: content} 或 selector+content, 或 match+value+content
#   click     — 点击元素                       参数: selector, index(1/"last"/N)
#   click_at  — 坐标点击                       参数: x, y
#   type_text — 键盘输入文本                   参数: text, submit_key?(Enter等)
#   press_key — 按键                           参数: key (Escape/Enter/Tab等)
#   wait      — 等待条件                       参数: strategy, value/selector/expr, timeout
#   evaluate  — 执行 JS 表达式                 参数: expr, save_to?(变量名)
#   extract   — 提取下载链接                   参数: strategy(css/js/semantic/auto), selector/expr
#   loop      — 循环检查直到条件满足            参数: condition, expr/selector/value, max_iterations, interval, on_timeout
#   branch    — 条件分支跳转                   参数: branches=[{if:JS, then:目标}, {elif:JS, then:目标}, {else:目标}]
#   screenshot— 截图                           参数: output?(路径)
#   snapshot  — 获取 Accessibility Tree         参数: format?("text"/"json"), save_to?
#   new_page  — 打开新 tab                     参数: url
#   list_pages— 列出所有 tab                   无参数
#   save      — 保存结果到文件                  无参数
#
# wait 的 5 种策略:
#   text      — 等指定文字出现                  参数: value="搜索结果"
#   element   — 等 CSS 元素出现                 参数: selector=".download-panel"
#   url_change— 等 URL 发生变化                无额外参数
#   js        — 等 JS 表达式返回 truthy         参数: expr="document.querySelectorAll('.result').length > 0"
#   timeout   — 固定等待 N 毫秒                 参数: timeout=3000
#
# branch 的条件跳转 (branches 列表格式):
#   branches:                    # 条件分支列表
#     - if: "JS表达式1"          # if: 第一个条件
#       then: 步号或标签          # if 满足时跳转的目标
#     - elif: "JS表达式2"        # elif: 更多条件 (可选, 可多项)
#       then: 步号或标签          # elif 满足时跳转的目标
#     - else: 步号或标签          # else: 默认跳转 (可选, 值就是目标)
#   ※ branches 列表格式直观对应 Python 的 if-elif-else 逻辑
#   ※ 每个条件按顺序评估, 第一个 truthy 的触发跳转, 后续不再判断
#   ※ then/else 可以使用 1-based 数字步号或步骤的 name 标签
#   ※ else 的值直接是跳转目标, 不需要 then 关键字
#   ※ 若省略 else, 所有条件不满足时继续执行下一步
#   ※ if/elif 表达式支持 ${变量名} 引用之前 save_to 存入的变量
#   ※ 每个步骤可以添加 name 字段作为标识, 如: name: "login"
#
# 每步可配:
#   on_fail: abort(默认)|skip|retry(N)  — 失败时的处理策略
#   delay: 浮点秒数                       — 步骤间延迟, 覆盖全局 STEP_DELAY
#   save_to: 变量名                       — 把结果存入变量, 后续步骤用 ${变量名} 引用
#   name: 字符串                          — 步骤标签, 用于日志标识和 branch then/else 引用
#
# 安全限制:
#   MAX_STEPS:    STEPS 配置中步骤数量的上限 (默认 100, 硬上限 200)
#   MAX_EXECUTIONS: 运行时总执行次数的上限 (默认 500, 硬上限 1000, 防止 branch 循环无限跳转)
#
# ===== 场景示例 =====

